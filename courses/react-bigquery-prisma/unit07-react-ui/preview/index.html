<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unit07 プレビュー — Reactで一覧画面を作る</title>
    <style>
      /* 見やすさのための最小限のスタイル。React の学習には関係ありません */
      body { font-family: system-ui, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
             margin: 0; padding: 24px; background: #f7f7f9; color: #222; line-height: 1.7; }
      main { max-width: 720px; margin: 0 auto; }
      section { background: #fff; border: 1px solid #e0e0e6; border-radius: 8px;
                padding: 16px 20px; margin-bottom: 20px; }
      h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 0; color: #35507a; }
      ul { padding-left: 20px; } li { margin: 2px 0; }
      input { padding: 6px 8px; font-size: 14px; border: 1px solid #bbb; border-radius: 4px; }
      button { padding: 6px 12px; font-size: 14px; margin-left: 6px; cursor: pointer; }
      .badge { background: #eef3ff; border: 1px solid #c3d4ff; border-radius: 10px;
               padding: 1px 8px; font-size: 12px; margin-left: 6px; }
      .error { color: #a12; } .muted { color: #777; }
      .hint { font-size: 12px; color: #777; }
    </style>
  </head>
  <body>
    <!-- React はこの空の <div> の中身を丸ごと管理します。
         HTML 側に書くのはこの1行だけ、というのが React アプリの普通の姿です。 -->
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
