<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>在庫一覧(仕入れ担当メモ) | 本の森書店</title>
</head>
<body>
    <table class="stock-table">
        <thead>
            <tr>
                <th>商品名</th>
                <th>価格</th>
                <th>在庫数</th>
                <th>登録日</th>
            </tr>
        </thead>
        <tbody>
            <tr class="record">
                <td class="name">  古書探偵の憂鬱  </td>
                <td class="price">¥1,200</td>
                <td class="stock">15</td>
                <td class="date">2026/11/3</td>
            </tr>
            <tr class="record">
                <td class="name">星屑の図書館　</td>
                <td class="price">￥　2,480</td>
                <td class="stock"> 4 </td>
                <td class="date">2026-11-05</td>
            </tr>
            <tr class="record">
                <td class="name">価格未定の新刊</td>
                <td class="price">価格未定</td>
                <td class="stock">10</td>
                <td class="date">2026/11/6</td>
            </tr>
            <tr class="record">
                <td class="name">在庫調整中の一冊</td>
                <td class="price">¥980</td>
                <td class="stock">-</td>
                <td class="date">2026-11-07</td>
            </tr>
            <tr class="record">
                <td class="name"></td>
                <td class="price">¥1,500</td>
                <td class="stock">7</td>
                <td class="date">2026/11/8</td>
            </tr>
            <tr class="record">
                <td class="name">海辺の詩集、改訂版</td>
                <td class="price">3,600円</td>
                <td class="stock">2</td>
                <td class="date">2026.11.09</td>
            </tr>
            <tr class="record">
                <td class="name">　名品切手集&quot;プレミア版&quot;　</td>
                <td class="price">¥ 720</td>
                <td class="stock">30</td>
                <td class="date">2026/11/10</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
