<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>フロア案内 | 本の森書店</title>
</head>
<body>
    <div class="floor-guide">
        <div class="floor" data-floor="1">
            <h2 class="floor-name">1階</h2>
            <div class="section">
                <span class="section-name">新刊コーナー</span>
                <span class="section-note">週替わりで入れ替え</span>
            </div>
            <div class="section">
                <span class="section-name">文芸コーナー</span>
                <span class="section-note">国内外の小説</span>
            </div>
        </div>
        <div class="floor" data-floor="2">
            <h2 class="floor-name">2階</h2>
            <div class="section">
                <span class="section-name">古書コーナー</span>
                <span class="section-note">絶版本も取り扱い</span>
            </div>
        </div>
    </div>
</body>
</html>
